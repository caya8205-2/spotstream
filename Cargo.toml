[package]
name = "spotstream"
version = "0.1.0"
edition = "2021"
authors = ["Caya <caya8205-2@users.noreply.github.com>"]
description = "Fast Spotify streaming CLI adapter for Discord bots and audio pipelines"
license = "MIT"

[dependencies]
librespot = { version = "0.8.0", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
open = "5"
dirs = "6"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
